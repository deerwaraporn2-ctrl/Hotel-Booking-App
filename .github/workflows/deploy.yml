
# Name shown in the GitHub Actions tab
name: Deploy Aurelia Resort Frontend

# Run when changes are pushed to main
# Also allow manual execution from GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid running multiple deployments at the same time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Build the React application
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the production build
      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # Publish the website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
